name: "\U0001f4f0 Daily News & Trends"

on:
  schedule:
    - cron: "0 5 * * *"  # Every day at 05:00 UTC (06:00 CET)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "site/package.json"

      - name: Install Node deps
        run: |
          cd site
          npm install

      - name: "\U0001f4f0 Fetch data & generate news articles and trends"
        env:
          # LLM auto-detection: llm_client.py will pick the best available
          # provider based on which API keys are set.
          # Priority: OpenAI > Anthropic > WatsonX > Groq > Ollama

          # LLM providers (auto-detected by llm_client.py)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
          WATSONX_URL: ${{ secrets.WATSONX_URL }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
        run: |
          echo "Step 1: Fetching data from RSS feeds..."
          python scripts/retrieve_data.py

          echo "Step 2: Generating individual news articles (top 5)..."
          python scripts/generate_news.py

          echo "Step 3: Generating ML-based trend analysis..."
          python scripts/generate_trends.py

          echo "\u2705 All content generation complete!"

      - name: Sync with remote before committing
        run: |
          git fetch origin master
          git reset --soft origin/master
          echo "\u2705 Synced with remote master"

      - name: Commit new content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "\U0001f4f0 Daily automated news update"
          file_pattern: "data/issues/*.json site/issues/*.md"
          commit_user_name: "NewsBot"
          commit_user_email: "actions@github.com"

      - name: Build Eleventy site
        run: |
          cd site
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
