name: "📰 Weekly News & Trends"

on:
  schedule:
    - cron: "0 8 * * 5"  # Every Friday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "site/package-lock.json"

      - name: Install Node deps
        run: |
          cd site
          npm install

      - name: ⚙️ Install Ollama (temporal CI environment)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: 🧠 Start Ollama & pull model
        run: |
          ollama serve &
          # Give the server time to start
          sleep 25
          # Pull a compact, fast model; change as you wish
          ollama pull gemma:2b

      - name: 📰 Fetch data & run CrewAI multi-agent markdown generation
        env:
          # Temporal Ollama env for CI
          OLLAMA_API_BASE: "http://127.0.0.1:11434"
          NEWS_LLM_MODEL: "ollama/gemma:2b"

          # Optional: other providers for local / non-CI runs
          # (These environment variables are used by CrewAI+LiteLLM under the hood.)
          # OpenAI:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Anthropic / Claude:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # IBM watsonx.ai:
          WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
          WATSONX_URL: ${{ secrets.WATSONX_URL }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
        run: |
          echo "Ollama service is running at $OLLAMA_API_BASE"
          python scripts/retrieve_data.py
          python scripts/generate_markdown.py

      - name: Commit new content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📰 Weekly automated news update"
          file_pattern: "data/issues/*.json site/issues/*.md"
          commit_user_name: "NewsBot"
          commit_user_email: "actions@github.com"

      - name: Build Eleventy site
        run: |
          cd site
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
